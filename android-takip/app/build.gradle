plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.yildizkumlama.emanettakip'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yildizkumlama.emanettakip'
        minSdk 21
        targetSdk 35
        // Ayrı uygulama: eski Emanet Stok APK'sından bağımsız kurulur
        versionCode runNo
        versionName "1.${runNo}"
    }

    signingConfigs {
        debug {
            storeFile file("$rootDir/../android-app/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
