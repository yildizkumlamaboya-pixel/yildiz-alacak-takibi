name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Android projesini oluştur
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          cp -r res/* android/app/src/main/res/
          mkdir -p android/app/src/main/java/com/yildizkumlama/alacak
          cp MainActivity.java android/app/src/main/java/com/yildizkumlama/alacak/MainActivity.java
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Sabit imza anahtarı (güncellemeler üstüne kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp android-app/debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyası
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk YildizAlacak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YildizAlacak-apk
          path: YildizAlacak.apk

      - name: Releases bölümüne koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-son --yes --cleanup-tag || true
          gh release create apk-son YildizAlacak.apk \
            --title "Yıldız Alacak APK (son sürüm 1.${{ github.run_number }})" \
            --notes "Otomatik derlendi. Telefona indirip kurun; önceki sürümün üstüne kurulur." \
            --latest
