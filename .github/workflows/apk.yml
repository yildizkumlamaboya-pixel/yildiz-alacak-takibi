name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-twa/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK derle (Chrome tabanlı uygulama - bildirim destekli)
        run: |
          set -o pipefail
          gradle -p android-twa assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Hata özeti
        if: failure()
        run: |
          touch build.log
          echo "::error title=Derleme hatasi::Son loglar%0A$(grep -v '^\s*at ' build.log | tail -n 60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: APK dosyası
        run: |
          cp android-twa/app/build/outputs/apk/debug/app-debug.apk YildizEmanetStok.apk
          FP=$(keytool -printcert -jarfile YildizEmanetStok.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "::notice title=Imza::$FP"

      - uses: actions/upload-artifact@v4
        with:
          name: YildizEmanetStok-apk
          path: YildizEmanetStok.apk

      - name: Releases bölümüne koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-son --yes --cleanup-tag || true
          gh release create apk-son YildizEmanetStok.apk \
            --title "Yıldız Emanet Stok APK (sürüm 2.${{ github.run_number }})" \
            --notes "Otomatik derlendi. Bildirim destekli (Chrome tabanlı). Önceki sürümün üstüne kurulur." \
            --latest
